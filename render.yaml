# Render 部署蓝图：后端 Spring Boot Web Service。
# 数据库为外部 MySQL（Render 免费层不提供 MySQL），连接参数在控制台以环境变量填写。
services:
  - type: web
    name: interview-system
    runtime: java
    rootDir: backend
    plan: free
    buildCommand: mvn -DskipTests package
    startCommand: java -jar target/interview-system-0.0.1-SNAPSHOT.jar
    envVars:
      - key: JAVA_VERSION
        value: "21"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DELETE_ALL_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
