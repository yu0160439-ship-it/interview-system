# Render 部署蓝图：后端 Spring Boot 以 Docker 容器运行（Render 原生运行时不支持 Java）。
# 数据库为外部 PostgreSQL（Supabase，Render 免费层不托管数据库），连接参数在控制台以环境变量填写。
services:
  - type: web
    name: interview-system
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DELETE_ALL_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
